name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # every mashup's plugin, one VDF each, one DLL for Gothic 1 and Gothic 2 NotR (plugin/CMakeLists.txt)
      - name: Build the plugins
        shell: cmd
        run: |
          call plugin\build.bat
          if errorlevel 1 exit /b 1

      - name: Verify the plugins were built
        shell: pwsh
        run: |
          foreach ($plugin in "plugin/out/build/G1-G2A-Release/gta/vdf/CJMovement.vdf",
                              "plugin/out/build/G1-G2A-Release/witcher/vdf/Witcher.vdf") {
            if (!(Test-Path $plugin)) {
              Write-Error "Build succeeded but $plugin was not found"
              exit 1
            }
          }

      # tools/installer_gui.py imports install.py, which imports every mashup's mashup_<game>.py, and
      # those import their tools and union.py, so PyInstaller bundles them and everything they import
      # (no --add-data or --hidden-import); --paths puts each mashup's tools next to the shared ones.
      # Pillow: GTA's radar; numpy: Geralt's model and fast texture encoding; py7zr: unpacking Union.
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow py7zr numpy

      - name: Build installer executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name GothicMashupInstaller `
            --paths tools `
            --paths mashups/gta/tools `
            --paths mashups/witcher/tools `
            tools/installer_gui.py

      # The exe has no console, so it writes its report into a file. It imports every mashup's tools
      # and downloads and unpacks Union into a scratch folder, so a broken build never gets released.
      - name: Smoke test installer executable
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selftest.log"
          $p = Start-Process -FilePath "dist/GothicMashupInstaller.exe" -ArgumentList "--selftest", "`"$log`"" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) {
            Write-Error "GothicMashupInstaller.exe --selftest failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Assemble release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item "dist/GothicMashupInstaller.exe" "release-package/"
          Copy-Item "plugin/out/build/G1-G2A-Release/gta/vdf/CJMovement.vdf" "release-package/"
          Copy-Item "plugin/out/build/G1-G2A-Release/witcher/vdf/Witcher.vdf" "release-package/"
          Copy-Item "README.md" "release-package/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "release-package/*" -DestinationPath "GothicMashupInstaller.zip" -Force

      - name: Upload the package (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: GothicMashupInstaller
          path: GothicMashupInstaller.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GothicMashupInstaller.zip
            release-package/GothicMashupInstaller.exe
            release-package/CJMovement.vdf
            release-package/Witcher.vdf
