name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build CJMovement.vdf
        shell: cmd
        run: |
          call plugin\CJMovement\build.bat
          if errorlevel 1 exit /b 1

      - name: Verify plugin was built
        shell: pwsh
        run: |
          $plugin = "plugin/CJMovement/out/build/G1-Release/vdf/CJMovement.vdf"
          if (!(Test-Path $plugin)) {
            Write-Error "Build succeeded but CJMovement.vdf was not found at $plugin"
            exit 1
          }

      # tools/installer_gui.py imports install.py, which imports the make_cj_*.py tools and union.py,
      # so PyInstaller bundles them and everything they import (no --add-data or --hidden-import).
      # Pillow: the radar; py7zr: unpacking Union; numpy: fast texture encoding.
      - name: Install packaging dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow py7zr numpy

      - name: Build installer executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name GothicGTAInstaller `
            --paths tools `
            tools/installer_gui.py

      # The exe has no console, so it writes its report into a file. It imports every tool and
      # downloads and unpacks Union into a scratch folder, so a broken build never gets released.
      - name: Smoke test installer executable
        shell: pwsh
        run: |
          $log = Join-Path $PWD "selftest.log"
          $p = Start-Process -FilePath "dist/GothicGTAInstaller.exe" -ArgumentList "--selftest", "`"$log`"" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) {
            Write-Error "GothicGTAInstaller.exe --selftest failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Assemble release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item "dist/GothicGTAInstaller.exe" "release-package/"
          Copy-Item "plugin/CJMovement/out/build/G1-Release/vdf/CJMovement.vdf" "release-package/"
          Copy-Item "README.md" "release-package/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "release-package/*" -DestinationPath "GothicGTAInstaller.zip" -Force

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GothicGTAInstaller.zip
            release-package/GothicGTAInstaller.exe
            release-package/CJMovement.vdf
